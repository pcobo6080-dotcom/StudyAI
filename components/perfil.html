<section class="perfil-card">

    <div class="perfil-cabecera">

        <div class="avatar">
            👤
        </div>

        <div>
            <h2 id="nombreUsuario">
                ¡Hola, estudiante!
            </h2>

            <p>
                Sigue aprendiendo y mejora cada día 🚀
            </p>
        </div>

    </div>


    <div class="estadisticas">

        <div class="estadistica">

            <span class="estadistica-icono">
                🔥
            </span>

            <strong id="rachaUsuario">
                0
            </strong>

            <small>
                días de racha
            </small>

        </div>


        <div class="estadistica">

            <span class="estadistica-icono">
                ⭐
            </span>

            <strong id="xpUsuario">
                0
            </strong>

            <small>
                XP
            </small>

        </div>


        <div class="estadistica">

            <span class="estadistica-icono">
                📚
            </span>

            <strong id="sesionesUsuario">
                0
            </strong>

            <small>
                sesiones
            </small>

        </div>


        <div class="estadistica">

            <span class="estadistica-icono">
                🎯
            </span>

            <strong id="mediaUsuario">
                0%
            </strong>

            <small>
                media
            </small>

        </div>

    </div>


    <div class="progreso-perfil">

        <div class="progreso-info">

            <span>
                Progreso de estudio
            </span>

            <strong id="nivelUsuario">
                Nivel 1
            </strong>

        </div>

        <div class="barra-progreso">

            <div
                id="barraProgreso"
                class="barra-progreso-interior">
            </div>

        </div>

        <small id="textoProgreso">
            0 / 100 XP para el siguiente nivel
        </small>

    </div>

</section>
