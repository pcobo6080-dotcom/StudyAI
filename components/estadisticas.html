<div class="estadisticas-panel">

    <div class="estadisticas-header">
        <div>
            <span class="estadisticas-etiqueta">
                STUDYAI
            </span>

            <h2>📊 Tus estadísticas</h2>

            <p>
                Mira cómo estás progresando.
            </p>
        </div>
    </div>


    <div class="estadisticas-grid">

        <!-- XP -->

        <div class="estadistica-card">

            <div class="estadistica-icono">
                ⭐
            </div>

            <div>
                <span>XP total</span>

                <strong id="estadisticasXP">
                    0
                </strong>
            </div>

        </div>


        <!-- RACHA -->

        <div class="estadistica-card">

            <div class="estadistica-icono">
                🔥
            </div>

            <div>
                <span>Racha</span>

                <strong>
                    <span id="estadisticasRacha">
                        0
                    </span>
                    días
                </strong>
            </div>

        </div>


        <!-- SESIONES -->

        <div class="estadistica-card">

            <div class="estadistica-icono">
                📚
            </div>

            <div>
                <span>Sesiones</span>

                <strong id="estadisticasSesiones">
                    0
                </strong>
            </div>

        </div>


        <!-- NIVEL -->

        <div class="estadistica-card">

            <div class="estadistica-icono">
                🏆
            </div>

            <div>
                <span>Nivel</span>

                <strong id="estadisticasNivel">
                    1
                </strong>
            </div>

        </div>

    </div>


    <!-- PROGRESO -->

    <div class="progreso-card">

        <div class="progreso-superior">

            <div>

                <span>
                    Progreso del nivel
                </span>

                <strong id="estadisticasNivelTexto">
                    Nivel 1
                </strong>

            </div>

            <strong id="estadisticasXPTexto">
                0 / 100 XP
            </strong>

        </div>


        <div class="barra-estadisticas">

            <div
                id="estadisticasBarra"
                class="barra-estadisticas-progreso"
            ></div>

        </div>


        <p id="estadisticasSiguiente">
            100 XP para el siguiente nivel
        </p>

    </div>


    <!-- MENSAJE -->

    <div
        id="mensajeEstadisticas"
        class="mensaje-estadisticas"
    >

        🚀 ¡Sigue estudiando para mejorar!

    </div>

</div>
